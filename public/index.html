<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Server Panel</title>
</head>
<body style="background:#111;color:white;text-align:center;padding-top:100px;">
<h2>🎮 서버 상태</h2>
<div id="status">불러오는 중...</div>

<hr>

<h3>🔐 관리자</h3>
<input type="password" id="pass" placeholder="비밀번호">
<button onclick="login()">로그인</button>

<div id="admin" style="display:none;">
  <h4>오프라인 문구 선택</h4>
  <select id="msgSelect">
    <option>서버가 재부팅중입니다</option>
    <option>지금 서버가 쉬고 있습니다 관리자에게 문의 해주세요</option>
    <option>점검중입니다 : 파일관련</option>
    <option>점검중입니다 : 보안관련</option>
    <option>점검중입니다 : 인게임 관련</option>
    <option>점검중입니다: 서버관련</option>
  </select>
  <br>
  <button onclick="save()">적용</button>
</div>

<script>
async function loadMessage() {
  const res = await fetch("/message");
  const data = await res.json();
  document.getElementById("status").innerText = data.msg;
}

async function login() {
  const pass = document.getElementById("pass").value;

  const res = await fetch("/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({password: pass})
  });

  const data = await res.json();

  if (data.success) {
    document.getElementById("admin").style.display = "block";
    alert("로그인 성공");
  } else {
    alert("비밀번호 틀림");
  }
}

async function save() {
  const msg = document.getElementById("msgSelect").value;

  await fetch("/message", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({msg})
  });

  alert("적용됨");
  loadMessage();
}

loadMessage();
</script>
</body>
</html>
